<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Ops Console</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2e;
      --muted: #97a3c2;
      --text: #e9eefc;
      --ok: #29c36a;
      --warn: #efb738;
      --bad: #ea5a5a;
      --line: #233153;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 12px; color: var(--muted); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .controls { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; }
    input, select, textarea, button {
      background: #0d1528;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
    }
    textarea { width: 100%; min-height: 78px; }
    button { cursor: pointer; }
    button:hover { border-color: #3c5291; }
    .pill { padding: 3px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
    .high { color: #ffd2d2; border-color: #5f2c2c; background: #2a1515; }
    .medium { color: #ffe9b8; border-color: #5f4f2c; background: #2a2215; }
    .low { color: #cfe9ff; border-color: #2c4b5f; background: #15212a; }
    .grid { display: grid; gap: 12px; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: #0c1529; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .planGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 10px 0 14px; }
    .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: #0c1529; }
    .kpiLabel { color: var(--muted); font-size: 12px; }
    .kpiValue { font-size: 18px; font-weight: 700; margin-top: 3px; }
    ul { margin: 8px 0; padding-left: 18px; }
    li { margin-bottom: 6px; }
    code { color: #d6e3ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lead Ops Console</h1>
    <p>Daily action view for fast follow-up and channel focus. Pull queue, execute sends, and stage-update in one place.</p>

    <div class="panel controls">
      <input id="token" type="password" placeholder="LEAD_DASHBOARD_TOKEN" />
      <input id="slaHours" type="number" min="1" max="168" value="24" title="SLA hours" />
      <input id="limit" type="number" min="1" max="100" value="25" title="Queue size" />
      <button id="refreshBtn">Refresh Queue + Plan</button>
    </div>

    <div class="panel">
      <strong>Daily plan: </strong><span id="planStatus" class="warn">Not loaded</span>
      <div class="planGrid">
        <div class="kpi">
          <div class="kpiLabel">Open leads</div>
          <div class="kpiValue" id="planOpenLeads">—</div>
        </div>
        <div class="kpi">
          <div class="kpiLabel">Overdue leads</div>
          <div class="kpiValue" id="planOverdueLeads">—</div>
        </div>
        <div class="kpi">
          <div class="kpiLabel">SLA window (hours)</div>
          <div class="kpiValue" id="planSlaHours">—</div>
        </div>
      </div>
      <div>
        <strong>Execution notes</strong>
        <ul id="planNotes"></ul>
      </div>
      <div>
        <strong>Top actions</strong>
        <ul id="planTopActions"></ul>
      </div>
      <div>
        <strong>Source allocation</strong>
        <ul id="planSourceRecommendations"></ul>
      </div>
    </div>

    <div class="panel">
      <strong>Queue status: </strong><span id="statusText" class="warn">Not loaded</span>
      <div id="queue" class="grid" style="margin-top:12px;"></div>
    </div>
  </div>

  <script>
    const statusText = document.getElementById('statusText');
    const queueEl = document.getElementById('queue');
    const planStatus = document.getElementById('planStatus');

    function authHeaders() {
      const token = document.getElementById('token').value.trim();
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
    }

    function priorityClass(priority) {
      if (priority === 'high') return 'high';
      if (priority === 'medium') return 'medium';
      return 'low';
    }

    async function fetchQueue() {
      const slaHours = Number(document.getElementById('slaHours').value || 24);
      const limit = Number(document.getElementById('limit').value || 25);
      statusText.textContent = 'Loading...';
      statusText.className = 'warn';

      const res = await fetch(`/api/project-briefs/follow-up-queue?slaHours=${slaHours}&limit=${limit}`, {
        headers: authHeaders()
      });

      const data = await res.json();
      if (!res.ok || !data.success) {
        throw new Error(data.error || 'Failed to load queue');
      }

      const followUp = data.followUp || {};
      const queue = followUp.queue || [];
      renderQueue(queue);
      statusText.textContent = `Loaded ${queue.length} lead(s) • ${followUp.overdueLeads || 0} overdue`;
      statusText.className = 'ok';
    }

    function renderPlanList(containerId, entries, formatter) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (!entries || !entries.length) {
        container.innerHTML = '<li><span class="warn">No items yet.</span></li>';
        return;
      }
      for (const item of entries) {
        const li = document.createElement('li');
        li.innerHTML = formatter(item);
        container.appendChild(li);
      }
    }

    function renderDailyPlan(plan) {
      document.getElementById('planOpenLeads').textContent = String(plan.openLeads ?? '—');
      document.getElementById('planOverdueLeads').textContent = String(plan.overdueLeads ?? '—');
      document.getElementById('planSlaHours').textContent = String(plan.slaHours ?? '—');

      renderPlanList('planNotes', plan.executionNotes || [], (item) => escapeHtml(item));
      renderPlanList('planTopActions', plan.topActions || [], (item) => {
        const action = escapeHtml(item.recommendedAction || 'Follow up');
        return `<code>${escapeHtml(item.briefId || '')}</code> • <strong>${escapeHtml(item.name || 'Unknown')}</strong> (${escapeHtml(item.priority || 'low')}/${escapeHtml(item.stage || 'new')}/${escapeHtml(item.briefIntent || 'other')}) — ${action}`;
      });
      renderPlanList('planSourceRecommendations', plan.sourceRecommendationDetails || [], (item) => {
        const shift = Number(item.allocationShiftPercent || 0);
        const shiftLabel = shift > 0 ? `+${shift}%` : `${shift}%`;
        const capLabel = item.sendCap ? ` • cap ${item.sendCap} sends` : '';
        const rule = item.executionRule ? ` • ${escapeHtml(item.executionRule)}` : '';
        return `<strong>${escapeHtml((item.action || 'review').toUpperCase())}</strong> ${escapeHtml(item.source || 'unknown')} — ${escapeHtml(item.reason || '')} <code>${escapeHtml(shiftLabel)}</code>${escapeHtml(capLabel)}${rule}`;
      });
    }

    async function fetchDailyPlan() {
      const slaHours = Number(document.getElementById('slaHours').value || 24);
      const limit = Number(document.getElementById('limit').value || 25);
      planStatus.textContent = 'Loading...';
      planStatus.className = 'warn';

      const res = await fetch(`/api/project-briefs/daily-plan?slaHours=${slaHours}&limit=${Math.max(limit, 200)}`, {
        headers: authHeaders()
      });
      const data = await res.json();
      if (!res.ok || !data.success) {
        throw new Error(data.error || 'Failed to load daily plan');
      }

      renderDailyPlan(data.plan || {});
      planStatus.textContent = 'Loaded';
      planStatus.className = 'ok';
    }

    async function refreshAll() {
      await Promise.all([fetchQueue(), fetchDailyPlan()]);
    }

    function renderQueue(items) {
      queueEl.innerHTML = '';

      if (!items.length) {
        queueEl.innerHTML = '<div class="card"><span class="ok">No leads currently in follow-up queue.</span></div>';
        return;
      }

      for (const lead of items) {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;">
            <strong>${escapeHtml(lead.name || 'Unknown')}</strong>
            <span class="pill ${priorityClass(lead.priority)}">${escapeHtml((lead.priority || 'low').toUpperCase())}</span>
          </div>
          <div class="meta">
            <span>${escapeHtml(lead.email || '')}</span>
            <span>• Stage: <strong>${escapeHtml(lead.stage || 'new')}</strong></span>
            <span>• Source: ${escapeHtml(lead.utmSource || lead.source || 'unknown')}</span>
            <span>• SLA: ${lead.overdue ? `Overdue by ${Math.abs(Number(lead.hoursUntilBreach || 0)).toFixed(1)}h` : `${Number(lead.hoursUntilBreach || 0).toFixed(1)}h left`}</span>
            ${lead.budget ? `<span>• Budget: ${escapeHtml(lead.budget)}</span>` : ''}
            ${lead.timeline ? `<span>• Timeline: ${escapeHtml(lead.timeline)}</span>` : ''}
            ${lead.briefIntent ? `<span>• Intent: ${escapeHtml(lead.briefIntent)}</span>` : ''}
          </div>
          <div>${escapeHtml(lead.summary || '(No summary provided)')}</div>
          ${lead.projectUrl ? `<div style="margin-top:6px;"><a href="${escapeHtml(lead.projectUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(lead.projectUrl)}</a></div>` : ''}
          <textarea data-note="${lead.briefId}" placeholder="Status note (optional)"></textarea>
          <div class="actions">
            <button data-action="draft" data-id="${lead.briefId}">Load draft</button>
            <button data-action="send" data-id="${lead.briefId}">Send first response</button>
            <button data-action="followup" data-id="${lead.briefId}">Send follow-up</button>
            <button data-action="proposal" data-id="${lead.briefId}">Send proposal</button>
            <button data-action="contacted" data-id="${lead.briefId}">Mark contacted</button>
            <button data-action="qualified" data-id="${lead.briefId}">Mark qualified</button>
            <button data-action="proposal_sent" data-id="${lead.briefId}">Mark proposal_sent</button>
          </div>
          <pre id="out-${lead.briefId}" style="white-space:pre-wrap;color:#b9c8f3;margin-top:10px;"></pre>
        `;

        queueEl.appendChild(card);
      }
    }

    async function patchStage(briefId, stage) {
      const note = document.querySelector(`textarea[data-note="${briefId}"]`)?.value || '';
      const res = await fetch(`/api/project-briefs/${briefId}`, {
        method: 'PATCH',
        headers: authHeaders(),
        body: JSON.stringify({ stage, statusNotes: note })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Stage update failed');
      return data;
    }

    async function loadDraft(briefId) {
      const res = await fetch(`/api/project-briefs/${briefId}/first-response-draft`, { headers: authHeaders() });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Draft generation failed');
      return data;
    }

    async function sendFirstResponse(briefId) {
      const note = document.querySelector(`textarea[data-note="${briefId}"]`)?.value || '';
      const res = await fetch(`/api/project-briefs/${briefId}/first-response-send`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ markContacted: true, statusNotes: note })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Send failed');
      return data;
    }

    async function sendFollowUp(briefId) {
      const note = document.querySelector(`textarea[data-note="${briefId}"]`)?.value || '';
      const res = await fetch(`/api/project-briefs/${briefId}/follow-up-send`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ statusNotes: note })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Follow-up failed');
      return data;
    }

    async function sendProposal(briefId) {
      const note = document.querySelector(`textarea[data-note="${briefId}"]`)?.value || '';
      const res = await fetch(`/api/project-briefs/${briefId}/proposal-send`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ statusNotes: note })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Proposal send failed');
      return data;
    }

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    queueEl.addEventListener('click', async (event) => {
      const btn = event.target.closest('button[data-action]');
      if (!btn) return;

      const action = btn.dataset.action;
      const briefId = btn.dataset.id;
      const output = document.getElementById(`out-${briefId}`);

      btn.disabled = true;
      output.textContent = 'Working...';

      try {
        let result;
        if (action === 'draft') {
          result = await loadDraft(briefId);
          output.textContent = `Subject: ${result.draft?.subject || ''}\n\n${result.draft?.body || ''}`;
        } else if (action === 'send') {
          result = await sendFirstResponse(briefId);
          output.textContent = `Sent first response\nStage: ${result.stage || ''}`;
          await refreshAll();
        } else if (action === 'followup') {
          result = await sendFollowUp(briefId);
          output.textContent = `Sent follow-up\nStage: ${result.stage || ''}`;
          await refreshAll();
        } else if (action === 'proposal') {
          result = await sendProposal(briefId);
          output.textContent = `Sent proposal\nStage: ${result.stage || ''}`;
          await refreshAll();
        } else {
          result = await patchStage(briefId, action);
          output.textContent = `Updated to ${result.brief?.stage || action}`;
          await refreshAll();
        }
      } catch (err) {
        output.textContent = `Error: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      try {
        await refreshAll();
      } catch (err) {
        statusText.textContent = err.message;
        statusText.className = 'bad';
        planStatus.textContent = err.message;
        planStatus.className = 'bad';
      }
    });
  </script>
</body>
</html>
